version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "anthropic" },
    { name = "beautifulsoup4" },
    { name = "httpx", extra = ["http2"] },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "python-dotenv" },
    { name = "pyyaml" },
    { name = "selectolax" },
    { name = "trafilatura" },
    { name = "typer" },
]

[package.optional-dependencies]
dev = [
    { name = "mypy" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "respx" },
    { name = "ruff" },
    { name = "types-pyyaml" },
]
dynamic = [
    { name = "playwright" },
]

[package.metadata]
requires-dist = [
    { name = "anthropic", specifier = ">=0.34" },
    { name = "beautifulsoup4", specifier = ">=4.12" },
    { name = "httpx", extras = ["http2"], specifier = ">=0.27" },
    { name = "mypy", marker = "extra == 'dev'", specifier = ">=1.10" },
    { name = "playwright", marker = "extra == 'dynamic'", specifier = ">=1.45" },
    { name = "pydantic", specifier = ">=2.7" },
    { name = "pydantic-settings", specifier = ">=2.3" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.2" },
    { name = "pytest-asyncio", marker = "extra == 'dev'", specifier = ">=0.23" },
    { name = "python-dotenv", specifier = ">=1.0" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "respx", marker = "extra == 'dev'", specifier = ">=0.21" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.5" },
    { name = "selectolax", specifier = ">=0.3.21" },
    { name = "trafilatura", specifier = ">=1.8" },
    { name = "typer", specifier = ">=0.12" },
    { name = "types-pyyaml", marker = "extra == 'dev'", specifier = ">=6.0" },
]
provides-extras = ["dynamic", "dev"]
