# Default configuration. Override any value with env vars using the SCRAPER_ prefix
# and __ for nesting, e.g. SCRAPER_FETCH__TIMEOUT=30, SCRAPER_VAULT_PATH=/path/to/vault.

# Path to your Obsidian vault. Defaults to the bundled `webscraper/` vault
# (it contains the .obsidian config). Point this at your own vault to use it.
vault_path: "webscraper"
contacts_dir: "Contacts"
profiles_dir: "Profiles"
research_dir: "Research"
hub_dir: "Hubs"           # crawl seed pages become map-of-content hub notes here

# Overwrite existing notes, or write a unique " (2)" suffixed file on collision.
overwrite_existing: false

# Rebuild Index.md automatically after every scrape (turn off with --no-index).
auto_index: true

# Recursive `crawl` command defaults (override per-run with CLI flags).
crawl:
  default_depth: 1        # seed + N levels of discovered sub-links
  max_pages: 20           # hard safety cap on pages scraped per crawl run
  same_domain: true       # stay on the seed host unless --allow-external

fetch:
  timeout: 20.0            # total request timeout (seconds)
  connect_timeout: 10.0
  max_redirects: 5
  http2: true
  respect_robots: true
  rotate_user_agent: true  # false = sticky per-session UA

throttle:
  rate: 1.0               # tokens (requests) per second, per host
  capacity: 3             # burst capacity

retry:
  max_attempts: 4
  base_delay: 0.5         # seconds
  max_delay: 30.0

dynamic:
  block_resources: ["image", "media", "font"]
  headless: true

llm:
  enabled: false          # opt-in; guards Anthropic API cost
  model: "claude-sonnet-5"
  max_tokens: 2048
  min_chars: 400          # skip the LLM if cleaned page text is shorter than this
